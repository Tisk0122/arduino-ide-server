name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: |
          python -m py_compile arduino-helper.py
          python -c "import ast, pathlib; ast.parse(pathlib.Path('arduino-build-run').read_text(encoding='utf-8'))"
      - name: Check shell syntax
        run: |
          for script in install.sh github-update.sh configure-github-webhook.sh backup-arduino-helper.sh verify-arduino-helper-backup.sh; do
            bash -n "$script"
          done
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m unittest discover -s tests -p "test_browser.py" -v
