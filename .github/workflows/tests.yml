name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Check text line endings and whitespace
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          failed = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for entry in tracked:
              if not entry:
                  continue
              path = Path(os.fsdecode(entry))
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if b"\0" in raw:
                  continue  # Binary asset.
              try:
                  raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              if b"\r\n" in raw or b"\r" in raw:
                  failed.append(str(path))
          if failed:
              raise SystemExit("LF line endings are required; found CRLF/CR:\n" + "\n".join(failed))
          PY
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: |
          python -m py_compile arduino-helper.py restore-test-arduino-helper.py backup-status-arduino-helper.py
          python -c "import ast, pathlib; ast.parse(pathlib.Path('arduino-build-run').read_text(encoding='utf-8'))"
      - name: Check shell syntax
        run: |
          for script in install.sh github-update.sh configure-github-webhook.sh backup-arduino-helper.sh verify-arduino-helper-backup.sh; do
            bash -n "$script"
          done
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m unittest discover -s tests -p "test_browser.py" -v
  linux-deploy-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test real updater deploy and rollback in an isolated filesystem
        run: sudo env "PATH=$PATH" "$(command -v python)" -m unittest discover -s tests -p "test_auto_update.py" -v
